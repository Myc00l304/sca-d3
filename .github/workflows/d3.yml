# D3: codzienny pomiar opóźnienia wykrywania nowych porad (praca magisterska).
name: D3 daily
on:
  schedule:
    - cron: "17 5 * * *"   # codziennie 05:17 UTC
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: d3
  cancel-in-progress: false
jobs:
  d3:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pilot/requirements.txt
      - name: Pamięć podręczna baz narzędzi i repozytoriów pakietów
        uses: actions/cache@v4
        with:
          path: ~/.cache/sca-thesis
          key: sca-cache-${{ github.run_id }}
          restore-keys: sca-cache-
      - name: Obrazy narzędzi (wersje z images.lock)
        run: tools/pull_locked.sh
      - name: Aktualizacja baz podatności
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          tools/update_dbs.sh
          tools/dc_update.sh
      - name: Seria dzienna D3
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python3 d3/d3_daily.py
      - name: Zapis wyników
        if: always()
        run: |
          git config user.name "d3-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add d3/data d3/projects
          git commit -m "D3: seria $(date -u +%F)" || echo "brak zmian"
          git push
